<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Curly Fries</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>

  <body>
    <!-- ================================
         NAVBAR
    ================================= -->

    <nav class="navbar navbar-expand-lg bg-dark sticky-top">
      <div class="container">
        <a href="index.html" class="navbar-brand">
          <img
            src="assets/images/logo1.png"
            alt="Curly Fries"
            class="logo-img"
          />
        </a>

        <button
          class="navbar-toggler navbar-dark"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="offcanvas offcanvas-start bg-dark text-white"
          tabindex="-1"
          id="offcanvasNavbar"
          aria-labelledby="offcanvasNavbarLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
              Curly <span>Fries</span>
            </h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>

          <div class="offcanvas-body">
            <ul
              class="navbar-nav justify-content-center gap-4 flex-grow-1 pe-3"
            >
              <li class="nav-item">
                <a class="nav-link text-white" href="index.html"> Home </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="menu.html"> Menu </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="about.html"> About Us </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#contact"> Contact </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white active" href="cart.html">
                  Cart
                  <span id="cartCount">0</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- ================================
         CHECKOUT HEADER
    ================================= -->

    <section class="checkout-header py-5">
      <div class="container text-center">
        <h1>Complete Your <span>Order</span></h1>
        <p>Enter your details and choose your preferred payment method.</p>
      </div>
    </section>

    <!-- ================================
         CHECKOUT SECTION
    ================================= -->
    <section class="checkout-section">
      <div class="container">
        <div class="row g-4">
          <!-- =========================
                     CUSTOMER INFORMATION
                ========================== -->

          <div class="col-12 col-lg-7">
            <div class="checkout-card">
              <h2>Customer Information</h2>
              <form id="checkoutForm">
                <div class="row g-3">
                  <!-- Full Name -->

                  <div class="col-12">
                    <label for="fullName" class="form-label"> Full Name </label>
                    <input
                      type="text"
                      class="form-control"
                      id="fullName"
                      placeholder="Enter your full name"
                      required
                    />
                  </div>

                  <!-- Phone -->
                  <div class="col-12 col-md-6">
                    <label for="phone" class="form-label"> Phone Number </label>
                    <input
                      type="tel"
                      class="form-control"
                      id="phone"
                      placeholder=""
                      required
                    />
                  </div>

                  <!-- Email -->

                  <div class="col-12 col-md-6">
                    <label for="email" class="form-label">
                      Email Address
                    </label>

                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="example@email.com"
                      required
                    />
                  </div>

                  <!-- =========================
                                     DELIVERY INFORMATION
                                ========================== -->

                  <div class="col-12">
                    <h2 class="checkout-subheading">Delivery Information</h2>
                  </div>

                  <!-- Location -->

                  <div class="col-12 col-md-6">
                    <label for="location" class="form-label"> Location </label>

                    <input
                      type="text"
                      class="form-control"
                      id="location"
                      placeholder="e.g. Kumasi"
                      required
                    />
                  </div>

                  <!-- Area -->

                  <div class="col-12 col-md-6">
                    <label for="area" class="form-label"> Area </label>

                    <input
                      type="text"
                      class="form-control"
                      id="area"
                      placeholder="e.g. Ahodwo"
                      required
                    />
                  </div>

                  <!-- Address -->
                  <div class="col-12">
                    <label for="address" class="form-label">
                      Delivery Address
                    </label>

                    <textarea
                      class="form-control"
                      id="address"
                      rows="3"
                      placeholder="Enter your full delivery address"
                      required
                    ></textarea>
                  </div>

                  <!-- Delivery Notes -->
                  <div class="col-12">
                    <label for="notes" class="form-label">
                      Delivery Notes
                      <span>(Optional)</span>
                    </label>

                    <textarea
                      class="form-control"
                      id="notes"
                      rows="3"
                      placeholder="Any special instructions?"
                    ></textarea>
                  </div>

                  <!-- =========================
                                     PAYMENT METHOD
                                ========================== -->

                  <div class="col-12">
                    <h2 class="checkout-subheading">Payment Method</h2>
                  </div>

                  <!-- Cash on Delivery -->
                  <div class="col-12">
                    <div class="payment-option">
                      <input
                        type="radio"
                        name="paymentMethod"
                        id="cashPayment"
                        value="cash"
                        checked
                      />
                      <label for="cashPayment">
                        <i class="bi bi-cash-stack"></i>
                        <span> Cash on Delivery </span>
                      </label>
                    </div>
                  </div>

                  <!-- Mobile Money -->
                  <div class="col-12">
                    <div class="payment-option">
                      <input
                        type="radio"
                        name="paymentMethod"
                        id="momoPayment"
                        value="momo"
                      />
                      <label for="momoPayment">
                        <i class="bi bi-phone"></i>
                        <span> Mobile Money </span>
                      </label>
                    </div>
                  </div>

                  <!-- Mobile Money Details -->
                  <div class="col-12 momo-details" id="momoDetails">
                    <div class="momo-box">
                      <label for="momoNetwork" class="form-label">
                        Mobile Money Network
                      </label>
                      <select class="form-select" id="momoNetwork">
                        <option value="">Select network</option>
                        <option value="mtn">MTN Mobile Money</option>
                        <option value="telecel">Telecel Cash</option>
                        <option value="airteltigo">AirtelTigo Money</option>
                      </select>

                      <label for="momoNumber" class="form-label mt-3">
                        Mobile Money Number
                      </label>

                      <input
                        type="tel"
                        class="form-control"
                        id="momoNumber"
                        placeholder="024 XXX XXXX"
                      />
                    </div>
                  </div>

                  <!-- Place Order -->
                  <div class="col-12">
                    <button type="submit" class="place-order-btn">
                      Place Order
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>

          <!-- =========================
                     ORDER SUMMARY
                ========================== -->

          <div class="col-12 col-lg-5">
            <div class="order-summary">
              <h2>Your Order</h2>

              <!-- Cart items will be inserted here -->
              <div id="checkoutItems"></div>
              <!-- Total -->
              <div class="checkout-total">
                <span> Total </span>
                <strong id="checkoutTotal"> GH₵ 0.00 </strong>
              </div>

              <!-- Back to Cart -->
              <a href="cart.html" class="back-cart-btn">
                <i class="bi bi-arrow-left"></i>
                Back to Cart
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-----FOOTER---->
    <footer class="text-center p-3 bottom text-white bg-dark">
      <div>&copy;2026 Curly <span>Fries</span> - Made To Crave.</div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Cart JS -->
    <script src="assets/js/cart.js"></script>

    <!-- Checkout JS -->
    <script src="assets/js/checkout.js"></script>
  </body>
</html>
